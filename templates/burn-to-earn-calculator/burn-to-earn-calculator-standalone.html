  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

te from the TCS Group Brand Guide (color palette page).\n   Salmon, Sky (#d4eef7), Navy (#223659), Slate (#7c7f8c). */\n:root {\n  /* ---- Brand core ---- */\n  --tcs-salmon:      #F0716D; /* primary accent — energy, CTAs */\n  --tcs-salmon-600:  #E4574F; /* hover / pressed accent */\n  --tcs-salmon-300:  #F7A9A5;\n  --tcs-salmon-100:  #FCE3E1; /* salmon tint surface */\n\n  --tcs-navy:        #223659; /* primary brand — headers, text, footer */\n  --tcs-navy-800:    #1A2A47;\n  --tcs-navy-600:    #33507F; /* lighter navy for links / accents on light */\n  --tcs-navy-050:    #EAEEF4; /* navy wash surface */\n\n  --tcs-sky:         #D4EEF7; /* soft supporting tint */\n  --tcs-sky-200:     #E7F5FA;\n  --tcs-sky-500:     #8FD0E6; /* saturated sky for small accents */\n\n  --tcs-slate:       #7C7F8C; /* neutral gray — secondary text, borders */\n  --tcs-slate-600:   #5B5E6A;\n  --tcs-slate-300:   #B7B9C1;\n  --tcs-slate-100:   #ECEDF0;\n\n  --tcs-black:       #000000; /* logo / high-contrast brand black */\n\n  /* ---- Neutrals (harmonized, cool) ---- */\n  --tcs-ink:         #16213A; /* near-black, navy-tinted, body text */\n  --tcs-white:       #FFFFFF;\n  --tcs-paper:       #FBFBFC; /* app background */\n  --tcs-cloud:       #F4F5F7; /* section alt background */\n  --tcs-line:        #E3E5EA; /* hairline borders */\n\n  /* ---- Semantic aliases ---- */\n  --color-bg:            var(--tcs-paper);\n  --color-bg-alt:        var(--tcs-cloud);\n  --color-bg-inverse:    var(--tcs-navy);\n  --surface-card:        var(--tcs-white);\n  --surface-tint:        var(--tcs-sky);\n  --surface-tint-warm:   var(--tcs-salmon-100);\n\n  --text-strong:         var(--tcs-navy);\n  --text-body:           var(--tcs-ink);\n  --text-muted:          var(--tcs-slate);\n  --text-inverse:        var(--tcs-white);\n  --text-on-accent:      var(--tcs-white);\n\n  --color-accent:        var(--tcs-salmon);\n  --color-accent-hover:  var(--tcs-salmon-600);\n  --color-primary:       var(--tcs-navy);\n  --color-primary-hover: var(--tcs-navy-800);\n\n  --border-default:      var(--tcs-line);\n  --border-strong:       var(--tcs-slate-300);\n  --focus-ring:          var(--tcs-navy-600);\n\n  --link:                var(--tcs-navy-600);\n  --link-hover:          var(--tcs-salmon-600);\n\n  /* ---- Status ---- */\n  --status-success:      #2E9E6B;\n  --status-warning:      #D9A441;\n  --status-danger:       var(--tcs-salmon-600);\n  --status-info:         var(--tcs-navy-600);\n}\n\n/* TCS Group — Typography tokens */\n:root {\n  /* Families — Red Hat Display is the brand web face for titles, subheaders & body. */\n  --font-sans:    'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-display: 'Red Hat Display', system-ui, sans-serif;\n  --font-mono:    'Red Hat Display', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weights */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n  --fw-extra:   800;  /* @kind font */\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --fs-display-xl: 4.5rem;  /* 72 — hero */\n  --fs-display-l:  3.5rem;  /* 56 */\n  --fs-display-m:  2.75rem; /* 44 */\n  --fs-h1:         2.25rem; /* 36 */\n  --fs-h2:         1.75rem; /* 28 */\n  --fs-h3:         1.375rem;/* 22 */\n  --fs-h4:         1.125rem;/* 18 */\n  --fs-body-lg:    1.125rem;/* 18 */\n  --fs-body:       1rem;    /* 16 */\n  --fs-body-sm:    0.875rem;/* 14 */\n  --fs-caption:    0.75rem; /* 12 */\n  --fs-eyebrow:    0.8125rem;/*13 */\n\n  /* Line heights */\n  --lh-tight:  1.05;  /* @kind font */\n  --lh-snug:   1.2;   /* @kind font */\n  --lh-normal: 1.5;   /* @kind font */\n  --lh-relaxed:1.7;   /* @kind font */\n\n  /* Letter spacing */\n  --ls-tight:   -0.02em; /* @kind font */\n  --ls-normal:  0;       /* @kind font */\n  --ls-eyebrow: 0.14em;  /* @kind font */ /* uppercase eyebrows / labels */\n  --ls-wide:    0.04em;  /* @kind font */\n}\n\n/* TCS Group — Spacing scale (4px base) */\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem; /* 4  */\n  --space-2:  0.5rem;  /* 8  */\n  --space-3:  0.75rem; /* 12 */\n  --space-4:  1rem;    /* 16 */\n  --space-5:  1.5rem;  /* 24 */\n  --space-6:  2rem;    /* 32 */\n  --space-7:  3rem;    /* 48 */\n  --space-8:  4rem;    /* 64 */\n  --space-9:  6rem;    /* 96 */\n  --space-10: 8rem;    /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-wide: 1360px;\n  --gutter: 1.5rem;\n  --section-y: 5rem;\n}\n\n/* TCS Group — Radius & shadow tokens */\n:root {\n  /* Corner radii — brand leans soft-but-architectural: gentle rounding,\n     with pills for interactive chips/CTAs. */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Shadows — cool, navy-tinted, soft. Cards sit close to the page. */\n  --shadow-xs: 0 1px 2px rgba(34, 54, 89, 0.06);\n  --shadow-sm: 0 2px 8px rgba(34, 54, 89, 0.08);\n  --shadow-md: 0 8px 24px rgba(34, 54, 89, 0.10);\n  --shadow-lg: 0 18px 48px rgba(34, 54, 89, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(51, 80, 127, 0.35);\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);      /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);      /* @kind other */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur-med: 220ms;   /* @kind other */\n  --dur-slow: 400ms;  /* @kind other */\n}\n\n/* TCS Group — base element defaults.\n   Light-touch resets + brand typographic defaults. */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--color-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-bold);\n  text-wrap: balance;\n}\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na {\n  color: var(--link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--link-hover); }\n\nstrong { font-weight: var(--fw-bold); color: var(--text-strong); }\n\nsmall { font-size: var(--fs-caption); }\n\ncode, kbd, samp { font-family: var(--font-mono); font-size: 0.9em; }\n\n::selection { background: var(--tcs-sky); color: var(--tcs-navy); }\n\n/* Utility: uppercase eyebrow label used across brand surfaces */\n.tcs-eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--color-accent);\n}\n\n<\u002Fstyle>\n\n<style>\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--tcs-cloud);font-family:var(--font-sans);color:var(--tcs-ink)}\na{color:var(--tcs-navy-600);text-decoration:none}a:hover{color:var(--tcs-salmon-600)}\n.hdr{background:var(--tcs-navy);color:#fff;padding:32px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}\n.eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tcs-salmon)}\n.hdr h1{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 0;color:#fff}\n.wrap{max-width:1220px;margin:0 auto;padding:32px 32px 56px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}\n@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}\n.panel{background:#fff;border:1px solid var(--tcs-line);border-radius:18px;box-shadow:var(--shadow-sm);padding:26px;display:flex;flex-direction:column;gap:20px}\n.lbl{display:block;font-size:14px;font-weight:700;color:var(--tcs-navy);margin-bottom:6px}\n.cap{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tcs-salmon)}\n.cap-n{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tcs-slate)}\n.in{width:100%;border:1.5px solid var(--tcs-line);border-radius:10px;padding:11px 14px;font-family:var(--font-sans);font-size:17px;font-weight:700;color:var(--tcs-navy);background:#fff;outline:none}\n.in:focus{border-color:var(--tcs-navy-600);box-shadow:0 0 0 3px rgba(51,80,127,.2)}\n.rng{width:100%;accent-color:var(--tcs-salmon);margin:0}\n.results{display:flex;flex-direction:column;gap:24px;min-width:0}\n.verdict{background:var(--tcs-salmon);color:#fff;border-radius:18px;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}\n.verdict .big{font-family:var(--font-display);font-weight:900;font-size:64px;line-height:1;letter-spacing:-.03em;margin-top:6px}\n.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}\n.vcard{background:#fff;border:1px solid var(--tcs-line);border-radius:14px;padding:18px 20px}\n.vcard.tint{background:var(--tcs-sky);border-color:var(--tcs-sky)}\n.vhead{display:flex;align-items:center;gap:10px}\n.num{width:26px;height:26px;border-radius:50%;background:var(--tcs-navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}\n.vname{font-size:14px;font-weight:800;color:var(--tcs-navy)}\n.vval{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--tcs-ink);margin-top:10px}\n.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}\n.rentcard{background:#fff;border:2px solid var(--tcs-salmon);border-radius:18px;padding:24px 26px}\n.owncard{background:var(--tcs-navy);border-radius:18px;padding:24px 26px;color:#fff}\n.tot{font-family:var(--font-display);font-weight:900;font-size:46px;line-height:1.05;margin:8px 0 14px}\n.row{display:flex;justify-content:space-between;font-size:15px;padding:7px 0;border-top:1px solid var(--tcs-line)}\n.owncard .row{border-top-color:rgba(255,255,255,.18)}\n.owncard .row span{color:rgba(255,255,255,.75)}\n.owncard .row strong{color:#fff}\n.outlook{background:#fff;border:1px solid var(--tcs-line);border-radius:18px;padding:24px 26px}\n.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}\n.olbl{font-size:13px;font-weight:700;color:var(--tcs-slate);text-transform:uppercase;letter-spacing:.06em}\n.oval{font-family:var(--font-display);font-weight:900;font-size:34px;color:var(--tcs-navy);margin-top:4px}\n.cta{background:var(--tcs-sky);border-radius:18px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}\n.note{font-size:12px;line-height:1.5;color:var(--tcs-slate)}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"hdr\">\n  <div>\n    <div class=\"eyebrow\">Burn-to-Earn™ Formula<\u002Fdiv>\n    <h1>What renting is really costing you<\u002Fh1>\n  <\u002Fdiv>\n  <img src=\"23dfbb4e-d6e0-43b4-beee-725429228805\" alt=\"TCS Group\" style=\"height:46px;width:auto;flex:0 0 auto\">\n<\u002Fdiv>\n\n<div class=\"wrap\">\n  <div class=\"panel\">\n    <div class=\"cap\">Your Numbers<\u002Fdiv>\n    <div>\n      <label class=\"lbl\" for=\"rent\">Current monthly rent<\u002Flabel>\n      <input class=\"in\" id=\"rent\" type=\"number\" value=\"2200\">\n    <\u002Fdiv>\n    <div>\n      <label class=\"lbl\" for=\"home\">Home price<\u002Flabel>\n      <input class=\"in\" id=\"home\" type=\"number\" step=\"5000\" value=\"350000\">\n    <\u002Fdiv>\n    <div>\n      <label class=\"lbl\" for=\"down\">Down payment — <span id=\"downPctL\">14.3<\u002Fspan>% (<span id=\"downAmtL\">$50,050<\u002Fspan>)<\u002Flabel>\n      <input class=\"rng\" id=\"down\" type=\"range\" min=\"0\" max=\"25\" step=\"0.1\" value=\"14.3\">\n      <div style=\"font-size:13px;color:var(--tcs-slate);margin-top:4px\">Loan amount: <strong id=\"loanL\" style=\"color:var(--tcs-navy)\">$299,950<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--tcs-line);padding-top:18px;display:flex;flex-direction:column;gap:16px\">\n      <div class=\"cap-n\">Assumptions<\u002Fdiv>\n      <div>\n        <label class=\"lbl\" for=\"tax\">Property tax rate — <span id=\"taxPctL\">1.5<\u002Fspan>%<\u002Flabel>\n        <input class=\"rng\" id=\"tax\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1.5\">\n      <\u002Fdiv>\n      <div>\n        <label class=\"lbl\" for=\"maint\">Maintenance — <span id=\"maintPctL\">1<\u002Fspan>% of value / yr<\u002Flabel>\n        <input class=\"rng\" id=\"maint\" type=\"range\" min=\"0.5\" max=\"2.5\" step=\"0.1\" value=\"1\">\n      <\u002Fdiv>\n      <div>\n        <label class=\"lbl\" for=\"appr\">Annual appreciation — <span id=\"apprPctL\">4<\u002Fspan>%<\u002Flabel>\n        <input class=\"rng\" id=\"appr\" type=\"range\" min=\"0\" max=\"8\" step=\"0.5\" value=\"4\">\n      <\u002Fdiv>\n      <div>\n        <label class=\"lbl\" for=\"ins\">Annual insurance<\u002Flabel>\n        <input class=\"in\" id=\"ins\" type=\"number\" step=\"100\" value=\"1700\">\n      <\u002Fdiv>\n      <div>\n        <label class=\"lbl\" for=\"benefit\">Monthly tax benefit<\u002Flabel>\n        <input class=\"in\" id=\"benefit\" type=\"number\" step=\"25\" value=\"300\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\">Mortgage estimated at $600 per $100,000 borrowed (principal &amp; interest), per the Burn-to-Earn™ quick rule.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"results\">\n    <div class=\"verdict\">\n      <div>\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.9)\" id=\"verdictL\">Losing per month to rent<\u002Fdiv>\n        <div class=\"big\" id=\"gapL\">$996<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:600;color:rgba(255,255,255,.92);margin-top:6px\"><span id=\"gapYearL\">$11,954<\u002Fspan> over the first year<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;flex:0 0 auto\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85)\">Equity in 5 years<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1.05;margin-top:4px\" id=\"equity5L\">$143,116<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"cap\" style=\"margin-bottom:14px\">The 6 variables<\u002Fdiv>\n      <div class=\"grid6\">\n        <div class=\"vcard\"><div class=\"vhead\"><span class=\"num\">1<\u002Fspan><span class=\"vname\">Monthly Rent<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v1\">$2,200<\u002Fdiv><\u002Fdiv>\n        <div class=\"vcard\"><div class=\"vhead\"><span class=\"num\">2<\u002Fspan><span class=\"vname\">Mortgage Payment<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v2\">$1,800<\u002Fdiv><\u002Fdiv>\n        <div class=\"vcard\"><div class=\"vhead\"><span class=\"num\">3<\u002Fspan><span class=\"vname\">Tax &amp; Insurance<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v3\">$579<\u002Fdiv><\u002Fdiv>\n        <div class=\"vcard\"><div class=\"vhead\"><span class=\"num\">4<\u002Fspan><span class=\"vname\">Ownership Costs<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v4\">$292<\u002Fdiv><\u002Fdiv>\n        <div class=\"vcard tint\"><div class=\"vhead\"><span class=\"num\">5<\u002Fspan><span class=\"vname\">Opportunity Cost<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v5\" style=\"color:var(--tcs-navy)\">$1,167<\u002Fdiv><div style=\"font-size:12px;color:var(--tcs-navy-600);margin-top:2px\">Appreciation you miss by renting<\u002Fdiv><\u002Fdiv>\n        <div class=\"vcard\"><div class=\"vhead\"><span class=\"num\">6<\u002Fspan><span class=\"vname\">Tax Benefit<\u002Fspan><\u002Fdiv><div class=\"vval\" id=\"v6\" style=\"color:var(--status-success)\">-$300<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"compare\">\n      <div class=\"rentcard\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tcs-salmon)\">Total Cost of Renting<\u002Fdiv>\n        <div class=\"tot\" style=\"color:var(--tcs-navy)\" id=\"rentTotalL\">$3,366<\u002Fdiv>\n        <div class=\"row\"><span style=\"color:var(--tcs-slate-600)\">Monthly rent<\u002Fspan><strong style=\"color:var(--tcs-navy)\" id=\"r1\">$2,200<\u002Fstrong><\u002Fdiv>\n        <div class=\"row\"><span style=\"color:var(--tcs-slate-600)\">Opportunity cost<\u002Fspan><strong style=\"color:var(--tcs-navy)\" id=\"r2\">$1,167<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"owncard\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tcs-sky)\">Total Cost of Owning<\u002Fdiv>\n        <div class=\"tot\" id=\"ownTotalL\">$2,370<\u002Fdiv>\n        <div class=\"row\"><span>Mortgage<\u002Fspan><strong id=\"o1\">$1,800<\u002Fstrong><\u002Fdiv>\n        <div class=\"row\"><span>Tax &amp; insurance<\u002Fspan><strong id=\"o2\">$579<\u002Fstrong><\u002Fdiv>\n        <div class=\"row\"><span>Maintenance<\u002Fspan><strong id=\"o3\">$292<\u002Fstrong><\u002Fdiv>\n        <div class=\"row\"><span>Tax benefit<\u002Fspan><strong style=\"color:var(--tcs-sky)\" id=\"o4\">-$300<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"outlook\">\n      <div class=\"cap\" style=\"margin-bottom:16px\">If you buy instead of rent<\u002Fdiv>\n      <div class=\"grid3\">\n        <div><div class=\"olbl\">Home value in 10 yrs<\u002Fdiv><div class=\"oval\" id=\"value10L\">$518,085<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"olbl\">Appreciation gained<\u002Fdiv><div class=\"oval\" style=\"color:var(--tcs-salmon)\" id=\"gain10L\">$168,085<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"olbl\">Rent paid, 10 yrs<\u002Fdiv><div class=\"oval\" style=\"color:var(--tcs-slate-600)\" id=\"rent10L\">$303,600<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cta\">\n      <div style=\"font-size:17px;font-weight:700;color:var(--tcs-navy)\">Let's find out which programs you qualify for.<\u002Fdiv>\n      <div style=\"font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--tcs-navy)\">(215) 692-6636<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var $ = function(id){ return document.getElementById(id); };\n  function money(n){ var v = Math.round(n); return (v<0?'-$':'$') + Math.abs(v).toLocaleString(); }\n  function val(id, fb){ var v = parseFloat($(id).value); return isNaN(v) ? fb : v; }\n\n  function calc(){\n    var rent = val('rent',0), homeValue = val('home',0), downPct = val('down',0),\n        taxPct = val('tax',0), maintPct = val('maint',0), apprPct = val('appr',0),\n        insurance = val('ins',0), taxBenefit = val('benefit',0);\n\n    var down = homeValue * (downPct/100);\n    var loan = Math.max(0, homeValue - down);\n    var mortgage = (loan/100000) * 600;                       // $600 per $100k borrowed\n    var taxIns = (homeValue * (taxPct/100) + insurance) / 12;\n    var maint = (homeValue * (maintPct/100)) / 12;\n    var opportunity = (homeValue * (apprPct/100)) / 12;       // appreciation missed by renting\n    var rentTotal = rent + opportunity;\n    var ownTotal = mortgage + taxIns + maint - taxBenefit;\n    var gap = rentTotal - ownTotal;\n\n    var value5 = homeValue * Math.pow(1 + apprPct/100, 5);\n    var value10 = homeValue * Math.pow(1 + apprPct/100, 10);\n    var equity5 = (value5 - homeValue) + down + (mortgage * 60 * 0.16);\n\n    $('downPctL').textContent = downPct;\n    $('downAmtL').textContent = money(down);\n    $('loanL').textContent = money(loan);\n    $('taxPctL').textContent = taxPct;\n    $('maintPctL').textContent = maintPct;\n    $('apprPctL').textContent = apprPct;\n\n    $('verdictL').textContent = gap >= 0 ? 'Losing per month to rent' : 'Renting costs less per month';\n    $('gapL').textContent = money(Math.abs(gap));\n    $('gapYearL').textContent = money(Math.abs(gap) * 12);\n    $('equity5L').textContent = money(Math.max(0, equity5));\n\n    $('v1').textContent = money(rent);\n    $('v2').textContent = money(mortgage);\n    $('v3').textContent = money(taxIns);\n    $('v4').textContent = money(maint);\n    $('v5').textContent = money(opportunity);\n    $('v6').textContent = '-' + money(taxBenefit);\n\n    $('rentTotalL').textContent = money(rentTotal);\n    $('r1').textContent = money(rent);\n    $('r2').textContent = money(opportunity);\n    $('ownTotalL').textContent = money(ownTotal);\n    $('o1').textContent = money(mortgage);\n    $('o2').textContent = money(taxIns);\n    $('o3').textContent = money(maint);\n    $('o4').textContent = '-' + money(taxBenefit);\n\n    $('value10L').textContent = money(value10);\n    $('gain10L').textContent = money(value10 - homeValue);\n    $('rent10L').textContent = money(rent * 12 * 10 * 1.15);\n  }\n\n  ['rent','home','down','tax','maint','appr','ins','benefit'].forEach(function(id){\n    $(id).addEventListener('input', calc);\n    $(id).addEventListener('change', calc);\n  });\n  calc();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
