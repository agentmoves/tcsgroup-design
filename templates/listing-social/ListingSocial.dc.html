<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Listing Social Post" description="Instagram 4:5 listing status post — Just Listed / Under Contract / New Price / Sold. Drop in listing + agent photos." -->
<!-- ASK FIRST — do not invent or placeholder these. Before populating this template, ask the user for: listing photo(s), property address, price, beds/baths/sqft, the status label (Just Listed / Under Contract / New Price / Sold), and the agent (name, headshot, phone, email). If the user has not supplied an image, ask for it rather than shipping a gray placeholder; agent headshots and contact details can be pulled from assets/agents/roster.json by name. -->
<helmet>
<script src="./ds-base.js"></script>
<script src="../../assets/image-slot.js"></script>
<style>
  .ls-post{--accent:var(--tcs-salmon);--bar:var(--tcs-navy)}
  .ls-post[data-status="Under Contract"]{--accent:var(--tcs-navy-600)}
  .ls-post[data-status="New Price"]{--accent:var(--status-warning)}
  .ls-post[data-status="Open House"]{--accent:var(--tcs-sky-500)}
  .ls-post[data-status="Sold"]{--accent:var(--status-success)}
</style>
</helmet>
<div class="ls-post" data-status="{{ status }}" style="position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--font-sans);background:#dcecf5">
  <img src="../../assets/scene-portrait.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />

  <!-- Header -->
  <div style="position:absolute;top:70px;left:70px;right:70px;z-index:2">
    <div style="font-family:var(--font-display);font-weight:800;font-size:96px;line-height:0.95;letter-spacing:-0.03em;color:var(--accent);text-transform:uppercase">{{ headline }}</div>
    <div style="width:120px;height:10px;background:var(--accent);border-radius:6px;margin:22px 0 20px"></div>
    <div style="font-size:30px;font-weight:700;color:var(--tcs-navy)">{{ address }}</div>
  </div>

  <!-- Listing photo -->
  <div style="position:absolute;top:430px;left:70px;right:70px;height:610px;border-radius:24px;overflow:hidden;box-shadow:0 18px 48px rgba(34,54,89,.28);border:6px solid #fff;z-index:2">
    <image-slot id="social-listing-photo" shape="rect" placeholder="Drop the listing photo"></image-slot>
  </div>

  <!-- Footer bar -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:230px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 60px;z-index:3">
    <div style="display:flex;flex-direction:column;gap:14px">
      <img src="../../assets/logo-kw-white.png" alt="TCS Group KW" style="height:56px;width:auto" />
      <div style="color:#fff;font-size:20px;font-weight:700;line-height:1.5">
        <div>(O): (215) 692-6636</div>
        <div style="color:var(--tcs-sky)">info.pa@tcsgroup.com</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:22px">
      <div style="text-align:right;color:#fff">
        <div style="font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.02em">{{ agentName }}</div>
        <div style="font-size:20px;font-weight:600;color:rgba(255,255,255,.85);margin-top:4px">(M): {{ agentPhone }}</div>
        <div style="font-size:19px;color:var(--tcs-sky)">{{ agentEmail }}</div>
      </div>
      <div style="width:130px;height:130px;border-radius:16px;overflow:hidden;border:3px solid rgba(255,255,255,.25)">
        <image-slot id="social-agent-photo" shape="rect" src="{{ agentSrc }}" placeholder="Agent photo"></image-slot>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1080, &quot;height&quot;: 1350 },
  &quot;status&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;,&quot;ahjah-crosland&quot;,&quot;alex-delcourt&quot;,&quot;andrew-goldberg&quot;,&quot;carmine-simmons&quot;,&quot;cassandra-green&quot;,&quot;christi-truesdell&quot;,&quot;claudia-brown&quot;,&quot;dan-deckelbaum&quot;,&quot;earl-gray&quot;,&quot;elaine-reby&quot;,&quot;eva-mitrushi&quot;,&quot;gaurav-gambhir&quot;,&quot;gavin-ludovici&quot;,&quot;gersham-fulcott&quot;,&quot;gregory-buck&quot;,&quot;griffin-cohen&quot;,&quot;jafar-oliai&quot;,&quot;jason-gizzi&quot;,&quot;john-bolaris&quot;,&quot;jon-hummel&quot;,&quot;joseph-cantz&quot;,&quot;juanita-jackson&quot;,&quot;karina-caroni&quot;,&quot;landry-nguema&quot;,&quot;liz-guerrero&quot;,&quot;madison-simone&quot;,&quot;matthew-milano&quot;,&quot;mia-purul&quot;,&quot;michael-edward-cohen&quot;,&quot;michael-gregor&quot;,&quot;michele-palumbo&quot;,&quot;morgan-harrington&quot;,&quot;pam-hooks&quot;,&quot;parker-ross&quot;,&quot;richard-yusko&quot;,&quot;rijon-simon&quot;,&quot;ryan-green&quot;,&quot;solon-alpohoritis&quot;,&quot;stephanie-churchill&quot;,&quot;suman-chakraborty&quot;,&quot;thomas-groll&quot;,&quot;tyler-doppelheuer&quot;,&quot;tyler-hopp&quot;,&quot;vladymir-valentin&quot;], &quot;default&quot;: &quot;Just Listed&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Listing&quot; },
  &quot;address&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1234 Wherever Lane, Philadelphia, PA 19134&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Listing&quot; },
  &quot;agentName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Agent Name&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; },
  &quot;agentPhone&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;(215) 555-0199&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; },
  &quot;agentEmail&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;agent@tcsgroup.com&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; },
  &quot;agentPhoto&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;&quot;, &quot;options&quot;: [&quot;&quot;,&quot;ahjah-crosland&quot;,&quot;alex-delcourt&quot;,&quot;andrew-goldberg&quot;,&quot;boots-levinson&quot;,&quot;carmine-simmons&quot;,&quot;cassandra-green&quot;,&quot;christi-truesdell&quot;,&quot;claudia-brown&quot;,&quot;dan-deckelbaum&quot;,&quot;earl-gray&quot;,&quot;elaine-reby&quot;,&quot;eva-mitrushi&quot;,&quot;gaurav-gambhir&quot;,&quot;gavin-ludovici&quot;,&quot;gersham-fulcott&quot;,&quot;gregory-buck&quot;,&quot;griffin-cohen&quot;,&quot;jafar-oliai&quot;,&quot;jason-gizzi&quot;,&quot;john-bolaris&quot;,&quot;jon-hummel&quot;,&quot;joseph-cantz&quot;,&quot;juanita-jackson&quot;,&quot;karina-caroni&quot;,&quot;landry-nguema&quot;,&quot;liz-guerrero&quot;,&quot;madison-simone&quot;,&quot;matthew-milano&quot;,&quot;mia-purul&quot;,&quot;michael-edward-cohen&quot;,&quot;michael-gregor&quot;,&quot;michele-palumbo&quot;,&quot;morgan-harrington&quot;,&quot;pam-hooks&quot;,&quot;parker-ross&quot;,&quot;richard-yusko&quot;,&quot;rijon-simon&quot;,&quot;ryan-green&quot;,&quot;solon-alpohoritis&quot;,&quot;stephanie-churchill&quot;,&quot;suman-chakraborty&quot;,&quot;thomas-groll&quot;,&quot;tyler-doppelheuer&quot;,&quot;tyler-hopp&quot;,&quot;vladymir-valentin&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; }
}">
class Component extends DCLogic {
  // Resolve agent photo + contact from the design-system roster.
  // Photo URL is derived from the loaded bundle's own location, so it resolves in
  // consuming projects at any folder depth (a hardcoded ../../ path does not).
  dsBase() {
    try {
      var s = document.querySelector('script[src*="_ds_bundle"]');
      if (s && s.src) return s.src.replace(/\/_ds_bundle\.js.*$/, '');
    } catch (e) {}
    return '../..';
  }
  agentRec(slug) {
    if (!slug) return null;
    var ns = null;
    for (var k in window) { if (k.indexOf('DesignSystem_') === 0) { ns = window[k]; break; } }
    var rec = (ns && ns.Agent && ns.Agent.get) ? ns.Agent.get(slug) : null;
    var key = String(slug).trim().toLowerCase().replace(/\s+/g, '-');
    return Object.assign({ photo: this.dsBase() + '/assets/agents/' + (rec ? rec.slug : key) + '.png' }, rec || {});
  }
  renderVals() {
    const p = this.props || {};
    const a = this.agentRec(p.agentPhoto);
    const status = p.status || 'Just Listed';
    return {
      status: status,
      headline: status,
      address: p.address || '1234 Wherever Lane, Philadelphia, PA 19134',
      agentName: p.agentName || (a && a.name) || 'Agent Name',
      agentPhone: p.agentPhone || (a && a.phone) || '',
      agentEmail: p.agentEmail || (a && a.email) || '',
      agentSrc: (a && a.photo) || '',
    };
  }
}
</script>
</body>
</html>
