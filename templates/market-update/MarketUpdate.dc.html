<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Market Update Email" description="County market-update graphic for email — county stats table + neighborhood appreciation table. Edit the data arrays." -->
<!-- ASK FIRST — do not invent or placeholder these. Before populating this template, ask the user for: the reporting month/period and the real county + neighborhood figures (median price, days on market, inventory, appreciation %). If the user has not supplied an image, ask for it rather than shipping a gray placeholder; agent headshots and contact details can be pulled from assets/agents/roster.json by name. -->
<helmet>
<script src="./ds-base.js"></script>
<script src="../../assets/image-slot.js"></script>
</helmet>
<div style="position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font-sans);background:#fff;display:flex;flex-direction:column">

  <!-- Header -->
  <div style="position:relative;background:var(--tcs-salmon);padding:44px 56px 30px;overflow:hidden">
    <img src="../../assets/logo-kw-white.png" alt="TCS Group" style="height:46px;width:auto;display:block;margin:0 auto" />
    <h1 style="font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1.02;color:#fff;text-transform:uppercase;letter-spacing:-.01em;margin:18px 0 6px;max-width:720px">{{ title }}</h1>
    <div style="font-family:var(--font-display);font-size:26px;font-weight:500;color:rgba(255,255,255,.92)">{{ subtitle }}</div>
    <div style="position:absolute;top:24px;right:48px;width:280px;height:250px;overflow:hidden">
      <image-slot id="market-agent-photo" shape="rect" src="{{ agentSrc }}" placeholder="Agent photo"></image-slot>
    </div>
  </div>

  <!-- County stats table -->
  <div style="background:var(--tcs-black);color:#fff;display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1.2fr 1fr;padding:26px 44px;gap:8px;font-size:20px;font-weight:800;text-transform:uppercase;text-align:center;line-height:1.1">
    <div style="text-align:left">County</div><div>Median Est Value</div><div>MoM Growth</div><div>Sale to List %</div><div>Avg Days on Market</div>
  </div>
  <div style="background:var(--tcs-cloud);padding:8px 44px 22px">
    <sc-for list="{{ counties }}" as="c" hint-placeholder-count="3">
      <div style="display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1.2fr 1fr;align-items:center;text-align:center;padding:18px 0;border-bottom:1px dashed var(--tcs-slate-300);color:var(--tcs-navy)">
        <div style="text-align:left;font-weight:800;font-size:26px">{{ c.name }}</div>
        <div style="font-size:30px">{{ c.median }}</div>
        <div style="font-size:26px">{{ c.mom }}</div>
        <div style="font-size:26px">{{ c.saleToList }}</div>
        <div style="font-size:30px">{{ c.dom }}</div>
      </div>
    </sc-for>
  </div>

  <!-- Neighborhood table -->
  <div style="flex:1;padding:26px 44px 0">
    <div style="display:grid;grid-template-columns:1.4fr 1fr 1.1fr;align-items:end;margin-bottom:12px;color:var(--tcs-navy);font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.1">
      <div>Neighborhood</div><div style="text-align:center">YoY Appreciation</div><div style="text-align:right">Median Estimated Value</div>
    </div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div>
        <div style="background:var(--tcs-navy-050);padding:8px 14px;font-weight:800;font-size:19px;color:var(--tcs-ink);border-radius:6px;margin:8px 0 4px">{{ g.county }}</div>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:1.4fr 1fr 1.1fr;align-items:center;padding:12px 14px;border-bottom:1px dashed var(--tcs-slate-300)">
            <div style="font-size:28px;color:var(--tcs-ink)">{{ r.name }}</div>
            <div style="font-size:24px;color:var(--tcs-ink);text-align:center">{{ r.yoy }}</div>
            <div style="font-size:30px;color:var(--tcs-ink);text-align:right">{{ r.value }}</div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- Footer -->
  <div style="background:var(--tcs-salmon);text-align:center;padding:26px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:.06em">{{ footer }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1080, &quot;height&quot;: 1920 },
  &quot;title&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Philadelphia, Montgomery &amp; Delaware Counties&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;subtitle&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Single Family Homes, Condos, Townhomes&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;footer&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;TCS GROUP  |  267-261-0700&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;agentPhoto&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;&quot;, &quot;options&quot;: [&quot;&quot;,&quot;ahjah-crosland&quot;,&quot;alex-delcourt&quot;,&quot;andrew-goldberg&quot;,&quot;boots-levinson&quot;,&quot;carmine-simmons&quot;,&quot;cassandra-green&quot;,&quot;christi-truesdell&quot;,&quot;claudia-brown&quot;,&quot;dan-deckelbaum&quot;,&quot;earl-gray&quot;,&quot;elaine-reby&quot;,&quot;eva-mitrushi&quot;,&quot;gaurav-gambhir&quot;,&quot;gavin-ludovici&quot;,&quot;gersham-fulcott&quot;,&quot;gregory-buck&quot;,&quot;griffin-cohen&quot;,&quot;jafar-oliai&quot;,&quot;jason-gizzi&quot;,&quot;john-bolaris&quot;,&quot;jon-hummel&quot;,&quot;joseph-cantz&quot;,&quot;juanita-jackson&quot;,&quot;karina-caroni&quot;,&quot;landry-nguema&quot;,&quot;liz-guerrero&quot;,&quot;madison-simone&quot;,&quot;matthew-milano&quot;,&quot;mia-purul&quot;,&quot;michael-edward-cohen&quot;,&quot;michael-gregor&quot;,&quot;michele-palumbo&quot;,&quot;morgan-harrington&quot;,&quot;pam-hooks&quot;,&quot;parker-ross&quot;,&quot;richard-yusko&quot;,&quot;rijon-simon&quot;,&quot;ryan-green&quot;,&quot;solon-alpohoritis&quot;,&quot;stephanie-churchill&quot;,&quot;suman-chakraborty&quot;,&quot;thomas-groll&quot;,&quot;tyler-doppelheuer&quot;,&quot;tyler-hopp&quot;,&quot;vladymir-valentin&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Agent&quot; }
}">
const COUNTIES = [
  { name: 'Philadelphia', median: '$375,880', mom: '+2.1%', saleToList: '99.3%', dom: '10' },
  { name: 'Delaware', median: '$445,640', mom: '+0.9%', saleToList: '103.2%', dom: '4' },
  { name: 'Montgomery', median: '$598,570', mom: '+1.2%', saleToList: '103%', dom: '4' },
];
const GROUPS = [
  { county: 'Philadelphia County', rows: [
    { name: 'Fairmount', yoy: '+0.6%', value: '$590,220' },
    { name: 'Northern Liberties', yoy: '-0%', value: '$504,100' },
    { name: 'Fishtown', yoy: '-3.3%', value: '$412,910' },
    { name: 'South Philly', yoy: '-2.3%', value: '$571,810' },
    { name: 'Graduate Hospital', yoy: '+3.8%', value: '$697,610' },
  ] },
  { county: 'Montgomery County', rows: [
    { name: 'Bryn Mawr', yoy: '+1.3%', value: '$1,205,250' },
    { name: 'Ardmore', yoy: '+3.2%', value: '$629,000' },
    { name: 'Bala Cynwyd', yoy: '-2.9%', value: '$933,420' },
  ] },
  { county: 'Delaware County', rows: [
    { name: 'Havertown', yoy: '+3.6%', value: '$583,900' },
    { name: 'Media', yoy: '+1.7%', value: '$729,780' },
    { name: 'Newtown Square', yoy: '+3.5%', value: '$881,010' },
    { name: 'Drexel Hill', yoy: '+4.4%', value: '$341,170' },
  ] },
];

class Component extends DCLogic {
  // Resolve agent photo + contact from the design-system roster.
  // Photo URL is derived from the loaded bundle's own location, so it resolves in
  // consuming projects at any folder depth (a hardcoded ../../ path does not).
  dsBase() {
    try {
      var s = document.querySelector('script[src*="_ds_bundle"]');
      if (s && s.src) return s.src.replace(/\/_ds_bundle\.js.*$/, '');
    } catch (e) {}
    return '../..';
  }
  agentRec(slug) {
    if (!slug) return null;
    var ns = null;
    for (var k in window) { if (k.indexOf('DesignSystem_') === 0) { ns = window[k]; break; } }
    var rec = (ns && ns.Agent && ns.Agent.get) ? ns.Agent.get(slug) : null;
    var key = String(slug).trim().toLowerCase().replace(/\s+/g, '-');
    return Object.assign({ photo: this.dsBase() + '/assets/agents/' + (rec ? rec.slug : key) + '.png' }, rec || {});
  }
  renderVals() {
    const p = this.props || {};
    const a = this.agentRec(p.agentPhoto);
    return {
      title: p.title || 'Philadelphia, Montgomery & Delaware Counties',
      subtitle: p.subtitle || 'Single Family Homes, Condos, Townhomes',
      footer: p.footer || 'TCS GROUP  |  267-261-0700',
      counties: COUNTIES,
      groups: GROUPS,
      agentSrc: (a && a.photo) || '',
    };
  }
}
</script>
</body>
</html>
