<!-- @dsCard group="Slides" viewport="1280x720" name="Services Slide" subtitle="Three-up service cards" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}
 .slide{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;font-family:var(--font-sans);background:var(--tcs-cloud)}
 .pad{padding:80px}
 .eb{font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tcs-salmon)}
 .logo{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:.28em}
 .logo .g{font-family:var(--font-sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
 h1{font-family:var(--font-display);letter-spacing:-.03em;line-height:1.02;margin:0}
</style></head><body><div class="slide"><div class="pad" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:40px">
  <div><span class="eb">What we do</span><h1 style="font-size:52px;color:var(--tcs-navy);margin-top:14px">Full-service, one-stop real estate</h1></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
    <div style="background:#fff;border:1px solid var(--tcs-line);border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(34,54,89,.10)">
        <div style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--tcs-navy)">Buy</div>
        <div style="width:40px;height:4px;background:var(--tcs-salmon);border-radius:2px;margin:14px 0 16px"></div>
        <div style="color:var(--tcs-slate-600);font-size:16px;line-height:1.6">The perfect home at the best price — with off-market access and financing guidance.</div>
      </div><div style="background:#fff;border:1px solid var(--tcs-line);border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(34,54,89,.10)">
        <div style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--tcs-navy)">Sell</div>
        <div style="width:40px;height:4px;background:var(--tcs-salmon);border-radius:2px;margin:14px 0 16px"></div>
        <div style="color:var(--tcs-slate-600);font-size:16px;line-height:1.6">Strategic pricing, staging, and negotiation to sell fast and for top dollar.</div>
      </div><div style="background:#fff;border:1px solid var(--tcs-line);border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(34,54,89,.10)">
        <div style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--tcs-navy)">Rent</div>
        <div style="width:40px;height:4px;background:var(--tcs-salmon);border-radius:2px;margin:14px 0 16px"></div>
        <div style="color:var(--tcs-slate-600);font-size:16px;line-height:1.6">A simpler way to rent — personalized matching across citywide inventory.</div>
      </div>
  </div>
</div></div></body></html>
