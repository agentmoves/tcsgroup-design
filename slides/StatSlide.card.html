<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}

 .pad{padding:80px}

 .logo{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:.28em}
 .logo .g{font-family:var(--font-sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
 h1{font-family:var(--font-display);letter-spacing:-.03em;line-height:1.02;margin:0}
</style></head><body><div class="slide"><div class="pad" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:48px">
  <div><span class="eb">By the numbers</span><h1 style="font-size:52px;color:var(--tcs-navy);margin-top:14px">A track record that speaks for itself</h1></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px">
    <div><div style="font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-.03em;color:var(--tcs-navy);line-height:1">4,500+</div><div style="margin-top:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--tcs-slate)">Units Managed</div></div><div><div style="font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-.03em;color:var(--tcs-navy);line-height:1">80+</div><div style="margin-top:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--tcs-slate)">Local Agents</div></div><div><div style="font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-.03em;color:var(--tcs-navy);line-height:1">1 in 5</div><div style="margin-top:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--tcs-slate)">Philly Home Sales</div></div><div><div style="font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-.03em;color:var(--tcs-navy);line-height:1">$500M</div><div style="margin-top:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--tcs-slate)">2023 Closed</div></div>
  </div>
</div></div></body></html>
