<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}
 .slide{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;font-family:var(--font-sans);background:linear-gradient(140deg,#1A2A47,#223659 55%,#33507F)}

 .logo .g{font-family:var(--font-sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase}

  <div>
    <span class="eb">Philadelphia · South Jersey</span>
    <h1 style="font-size:88px;color:#fff;margin-top:20px">Simplifying your<br><span style="color:var(--tcs-sky)">real estate</span> experience.</h1>
  </div>
  <div style="font-size:18px;color:rgba(255,255,255,.6)">Full-service brokerage · Licensed in 5 states</div>
</div></div></body></html>
