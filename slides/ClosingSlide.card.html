<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}
 .slide{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;font-family:var(--font-sans);background:linear-gradient(140deg,#1A2A47,#223659 60%,#33507F)}
 .pad{padding:80px}
 .eb{font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tcs-salmon)}
 .logo{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:.28em}
 .logo .g{font-family:var(--font-sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
 h1{font-family:var(--font-display);letter-spacing:-.03em;line-height:1.02;margin:0}
</style></head><body><div class="slide"><div class="pad" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:28px;color:#fff">
  <span class="eb">Let's find your next move</span>
  <h1 style="font-size:72px;color:#fff;max-width:900px">Ready when you are.</h1>
  <div style="display:inline-flex;gap:16px;margin-top:8px">
    <span style="background:var(--tcs-salmon);color:#fff;font-weight:700;padding:16px 34px;border-radius:999px;font-size:18px">Get Started</span>
    <span style="border:1.5px solid rgba(255,255,255,.5);color:#fff;font-weight:700;padding:16px 34px;border-radius:999px;font-size:18px">(215) 692-6636</span>
  </div>
  <div style="margin-top:40px;display:flex;align-items:center;gap:16px;font-size:16px;color:rgba(255,255,255,.55)"><img src="../assets/logo-mark-white.png" alt="TCS Group" style="height:30px;width:auto"><span>tcsgroup.com · at Keller Williams</span></div>
</div></div></body></html>
