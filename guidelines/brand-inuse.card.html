<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;font-family:var(--font-sans)}
 .hero{background:linear-gradient(135deg,var(--tcs-navy),var(--tcs-navy-800));color:#fff;padding:40px;min-height:300px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:18px}
 .eb{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tcs-salmon)}
 .h{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0;max-width:560px;color:#fff}
 .h em{font-style:normal;color:var(--tcs-sky)}
 .cta{align-self:flex-start;background:var(--tcs-salmon);color:#fff;font-weight:700;padding:14px 28px;border-radius:999px;font-size:15px}
</style></head><body>
<div class="hero">
 <span class="eb">Philadelphia · South Jersey</span>
 <h1 class="h">Simplifying your <em>real estate</em> experience.</h1>
 <span class="cta">Find a Home</span>
</div>
</body></html>
