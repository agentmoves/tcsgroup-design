<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Cool navy-tinted shadows" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--tcs-paper);font-family:var(--font-sans);color:var(--text-body)}
  .sw{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:8px}
  .box{width:120px;height:72px;border-radius:12px;border:1px solid var(--border-default)}
  .nm{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tcs-slate)}
</style></head><body><div class="sw">
<div class="chip"><div style="width:120px;height:64px;background:var(--tcs-white);border-radius:12px;box-shadow:var(--shadow-xs)"></div><span class="hex">xs</span></div><div class="chip"><div style="width:120px;height:64px;background:var(--tcs-white);border-radius:12px;box-shadow:var(--shadow-sm)"></div><span class="hex">sm</span></div><div class="chip"><div style="width:120px;height:64px;background:var(--tcs-white);border-radius:12px;box-shadow:var(--shadow-md)"></div><span class="hex">md</span></div><div class="chip"><div style="width:120px;height:64px;background:var(--tcs-white);border-radius:12px;box-shadow:var(--shadow-lg)"></div><span class="hex">lg</span></div>
</div></body></html>
