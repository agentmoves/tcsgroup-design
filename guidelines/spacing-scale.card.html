<!-- @dsCard group="Spacing" viewport="700x260" name="Spacing Scale" subtitle="4px base rhythm" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--tcs-paper);font-family:var(--font-sans);color:var(--text-body)}
  .sw{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:8px}
  .box{width:120px;height:72px;border-radius:12px;border:1px solid var(--border-default)}
  .nm{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tcs-slate)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end">
<div class="chip"><div style="height:4px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">1 · 4px</span></div><div class="chip"><div style="height:8px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">2 · 8px</span></div><div class="chip"><div style="height:12px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">3 · 12px</span></div><div class="chip"><div style="height:16px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">4 · 16px</span></div><div class="chip"><div style="height:24px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">5 · 24px</span></div>
<div class="chip"><div style="height:32px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">6 · 32px</span></div><div class="chip"><div style="height:48px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">7 · 48px</span></div><div class="chip"><div style="height:64px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">8 · 64px</span></div><div class="chip"><div style="height:96px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">9 · 96px</span></div><div class="chip"><div style="height:128px;width:100%;background:var(--tcs-salmon);border-radius:3px"></div><span class="hex">10 · 128px</span></div>
</div></body></html>
