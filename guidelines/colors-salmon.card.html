<!-- @dsCard group="Colors" viewport="700x180" name="Salmon Scale" subtitle="Accent — CTAs & energy" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--tcs-paper);font-family:var(--font-sans);color:var(--text-body)}
  .sw{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:8px}
  .box{width:120px;height:72px;border-radius:12px;border:1px solid var(--border-default)}
  .nm{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tcs-slate)}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:var(--tcs-salmon-100)"></div><span class="nm">100</span><span class="hex">#FCE3E1</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-salmon-300)"></div><span class="nm">300</span><span class="hex">#F7A9A5</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-salmon)"></div><span class="nm">Salmon</span><span class="hex">#F0716D</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-salmon-600)"></div><span class="nm">600</span><span class="hex">#E4574F</span></div>
</div></body></html>
