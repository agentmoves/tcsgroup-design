<!-- @dsCard group="Type" viewport="700x330" name="Type Scale" subtitle="Display → caption ramp" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--tcs-paper);font-family:var(--font-sans);color:var(--text-body)}
  .sw{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:8px}
  .box{width:120px;height:72px;border-radius:12px;border:1px solid var(--border-default)}
  .nm{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tcs-slate)}
</style></head><body><div style="display:flex;flex-direction:column;gap:6px;color:var(--text-strong);font-family:var(--font-display)">
<div style="font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05">Display 44</div>
<div style="font-size:36px;font-weight:700;letter-spacing:-.02em">Heading 1 · 36</div>
<div style="font-size:28px;font-weight:700">Heading 2 · 28</div>
<div style="font-size:22px;font-weight:700">Heading 3 · 22</div>
<div style="font-family:var(--font-sans);font-size:16px;font-weight:400;color:var(--text-body)">Body · 16 — the workhorse reading size</div>
<div style="font-family:var(--font-sans);font-size:14px;color:var(--text-muted)">Small · 14</div>
<div style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">Caption · 12</div>
</div></body></html>
