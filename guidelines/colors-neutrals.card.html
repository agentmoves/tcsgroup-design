<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Ink, surfaces & hairlines" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--tcs-paper);font-family:var(--font-sans);color:var(--text-body)}
  .sw{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:8px}
  .box{width:120px;height:72px;border-radius:12px;border:1px solid var(--border-default)}
  .nm{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tcs-slate)}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:var(--tcs-ink)"></div><span class="nm">Ink</span><span class="hex">#16213A</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-paper)"></div><span class="nm">Paper</span><span class="hex">#FBFBFC</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-cloud)"></div><span class="nm">Cloud</span><span class="hex">#F4F5F7</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-line)"></div><span class="nm">Line</span><span class="hex">#E3E5EA</span></div>
<div class="chip"><div class="box" style="background:var(--tcs-slate-300)"></div><span class="nm">Slate 300</span><span class="hex">#B7B9C1</span></div>
</div></body></html>
