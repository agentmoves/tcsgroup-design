<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="Pillar mark + wordmark · black / white · KW co-brand" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
  .lt{background:var(--tcs-cloud)}
  .dk{background:var(--tcs-navy)}
  img{height:56px;width:auto}
  .cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .cap.d{color:var(--tcs-slate)}
  .cap.l{color:rgba(255,255,255,.6)}
</style></head><body>
<div class="grid" style="height:300px">
  <div class="cell lt"><img src="../assets/logo-mark-black.png"><span class="cap d">Primary · black on light</span></div>
  <div class="cell dk"><img src="../assets/logo-mark-white.png"><span class="cap l">Primary · white on dark</span></div>
  <div class="cell lt"><img src="../assets/logo-kw-black.png"><span class="cap d">KW co-brand · black</span></div>
  <div class="cell dk"><img src="../assets/logo-kw-white.png"><span class="cap l">KW co-brand · white</span></div>
</div>
</body></html>
