<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; }
  .tile { width: 1280px; height: 854px; display: flex; font-family: var(--font-sans); }
  .main {
    flex: 1;
    background: var(--tcs-navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 160px;
  }
  .main img { max-width: 100%; max-height: 300px; width: auto; height: auto; object-fit: contain; }
  .strip { width: 25%; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logo-mark-white.png" alt="TCS Group"></div>
  <div class="strip">
    <div style="background: var(--tcs-sky)"></div>
    <div style="background: var(--tcs-salmon-300)"></div>
    <div style="background: var(--tcs-salmon)"></div>
    <div style="background: var(--tcs-salmon-600)"></div>
  </div>
</div>
</body>
</html>
