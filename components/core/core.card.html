<style>
  body { margin: 0; padding: 24px; background: var(--tcs-paper); font-family: var(--font-sans); }
  .grp { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Tag, Input, Select } = window.DesignSystem_7a2e65;
function Demo() {
  return (
    <div className="grp">
      <div>
        <div className="lbl">Buttons</div>
        <div className="row">
          <Button variant="primary" size="lg">Find a Home</Button>
          <Button variant="secondary">Sell With Us</Button>
          <Button variant="outline">Explore Rentals</Button>
          <Button variant="ghost">Learn more</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
      </div>
      <div>
        <div className="lbl">Tags</div>
        <div className="row">
          <Tag tone="salmon">For Sale</Tag>
          <Tag tone="sky">For Rent</Tag>
          <Tag tone="navy" dot>Featured</Tag>
          <Tag tone="slate">Condos</Tag>
          <Tag tone="outline" size="sm">Rittenhouse</Tag>
          <Tag tone="success" dot>Closed</Tag>

      </div>

          <Input label="Search" prefix="⌕" placeholder="City, ZIP, address" />
          <Input label="Min Price" prefix="$" placeholder="0" />
          <Select label="Beds" options={['Any','1+','2+','3+','4+']} />

      </div>
    </div>

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
